name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr

      - name: Build with coverage
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug \
                   -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
                   -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./kernel_tests

      - name: Coverage gate (80% minimum)
        run: |
          cd build
          # Generate coverage for src/ only, exclude main.cpp (daemon entry, not unit-testable)
          gcovr --root .. \
                 --filter '../src/' \
                 --exclude '../src/main.cpp' \
                 --print-summary \
                 --txt - \
                 | tee coverage_summary.txt

          COVERAGE=$(grep -oP 'lines:\s+\K[\d.]+' coverage_summary.txt || echo "0")
          echo "Line coverage: ${COVERAGE}%"

          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Per-file coverage report
        if: always()
        run: |
          cd build
          gcovr --root .. \
                 --filter '../src/' \
                 --exclude '../src/main.cpp' \
                 --txt - \
                 | tee coverage_detail.txt
          cat coverage_detail.txt
